<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的导航</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202124;
      background: linear-gradient(135deg, #edf4ff, #f8faff);
    }
    header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background: #fff;
      border-bottom: 1px solid #e8eaed;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
    .brand-icon {
      width: 34px; height: 34px; display: grid; place-items: center;
      color: #fff; background: #4285f4; border-radius: 10px;
    }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #dfe9f8; }
    main { max-width: 900px; margin: 0 auto; padding: 72px 24px; }
    h1 { margin: 0 0 28px; text-align: center; font-size: 30px; }
    .search {
      display: flex; max-width: 680px; height: 52px; margin: 0 auto 48px;
      background: #fff; border: 1px solid #dfe1e5; border-radius: 26px;
      box-shadow: 0 2px 8px rgba(60, 64, 67, 0.12); overflow: hidden;
    }
    .search input { flex: 1; border: 0; outline: 0; padding: 0 20px; font-size: 16px; }
    .search button { width: 52px; border: 0; color: #4285f4; background: transparent; cursor: pointer; font-size: 20px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .card {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 22px 10px; color: #202124; text-decoration: none;
      background: #fff; border: 1px solid #edf0f3; border-radius: 16px; transition: 0.2s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(60, 64, 67, 0.12); }
    .card-icon {
      width: 48px; height: 48px; display: grid; place-items: center;
      font-size: 24px; background: #f1f3f4; border-radius: 14px;
    }
    @media (max-width: 640px) {
      header { padding: 0 16px; }
      main { padding-top: 48px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="brand-icon">网</div>我的导航</div>
    <div class="avatar"></div>
  </header>
  <main>
    <h1>从这里开始探索</h1>
    <form class="search" action="https://www.baidu.com/s">
      <input name="wd" type="search" placeholder="搜索或输入网址">
      <button type="submit" aria-label="搜索">⌕</button>
    </form>
    <div class="grid">
      <a class="card" href="https://www.google.com"><div class="card-icon">G</div><span>Google</span></a>
      <a class="card" href="https://github.com"><div class="card-icon">⌘</div><span>GitHub</span></a>
      <a class="card" href="https://www.bilibili.com"><div class="card-icon">▶</div><span>Bilibili</span></a>
      <a class="card" href="https://www.zhihu.com"><div class="card-icon">知</div><span>知乎</span></a>
    </div>
  </main>
</body>
</html>
